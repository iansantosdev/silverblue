# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json

name: silverblue
description: Fedora Atomic
base-image: quay.io/fedora-ostree-desktops/silverblue
image-version: 44

modules:
  - type: dnf
    repos:
      nonfree: rpmfusion
      files:
        - https://pkgs.tailscale.com/stable/fedora/tailscale.repo
      cleanup: true
    install:
      install-weak-deps: false
      packages:
        - android-tools
        - ddcutil
        - ffmpegthumbnailer
        - gcc
        - intel-media-driver
        - libheif-freeworld
        - mesa-va-drivers-freeworld
        - opendoas
        - tailscale
        - https://github.com/trapexit/mergerfs/releases/download/2.41.1/mergerfs-2.41.1-1.fc43.x86_64.rpm
    remove:
      packages:
        - fedora-bookmarks
        - fedora-chromium-config
        - fedora-chromium-config-gnome
        - fedora-flathub-remote
        - fedora-repos-archive
        - fedora-third-party
        - fedora-workstation-repositories
        - firefox
        - firefox-langpacks
        - gnome-classic-session
        - gnome-shell-extension-apps-menu
        - gnome-shell-extension-background-logo
        - gnome-shell-extension-common
        - gnome-shell-extension-launch-new-instance
        - gnome-shell-extension-places-menu
        - gnome-shell-extension-window-list
        - gnome-software-rpm-ostree
        - gnome-system-monitor
        - gnome-tour
        - yelp
    replace:
      - from-repo: rpmfusion-free
        allow-erasing: true
        install-weak-deps: false
        packages:
          - new: ffmpeg
            old: ffmpeg-free

  - type: brew
    auto-update: true
    auto-upgrade: true
    brew-analytics: false

  - type: gnome-extensions
    source: local
    install:
      - Alphabetical App Grid
      - Clipboard History
      - Hot Edge
      - Just Perfection
      - Weather O'Clock

  - type: gschema-overrides

  - type: files
    files:
      - source: system
        destination: /

  - type: systemd
    system:
      enabled:
        - rpm-ostreed-automatic.timer
        - silverblue-autologin.path
        - silverblue-autologin.service
        - silverblue-flatpak-remove-fedora-remotes.service
        - tailscaled.service
      masked:
        - flatpak-add-fedora-repos.service
        - rpm-ostree-countme.service
        - rpm-ostree-countme.timer
    user:
      enabled:
        - podman-auto-update.timer
        - podman.socket
        - silverblue-firefox-theme-update.timer
        - silverblue-firefox-userjs-update.timer
        - silverblue-flatpak-user-preinstall.service
        - silverblue-flatpak-user-update.timer
        - silverblue-homebrew-configure.path
        - silverblue-ptyxis-reset-settings.service

  - type: bling
    install:
      - dconf-update-service

  - type: fonts
    fonts:
      nerd-fonts:
        - JetBrainsMono

  - type: script
    scripts:
      - set-file-permissions.sh
      - install-spotify-flatpak-panel.sh
      - fix-extension-version.sh
      - remove-brew-completions.sh

  - type: chezmoi
    repository: git@github.com:iansantosdev/dotfiles.git

  - type: signing
