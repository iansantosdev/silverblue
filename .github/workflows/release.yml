name: Build Custom Image

on:
  push:
    branches:
      - testing
    paths-ignore:
      - "**.md"
  pull_request:
    branches:
      - testing
  repository_dispatch:
    types:
      - build-image
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Extract BlueBuild
        run: |
          installer_container="$(
            podman create \
              --pull=always \
              ghcr.io/blue-build/cli:latest-installer
          )"
          cleanup() {
            podman rm --force "$installer_container" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          podman cp \
            "$installer_container:/out/bluebuild" \
            "$RUNNER_TEMP/bluebuild"

      - name: Validate repository
        run: |
          podman run --rm \
            --pull=always \
            --volume "$GITHUB_WORKSPACE:/workspace:ro" \
            --volume "$RUNNER_TEMP/bluebuild:/usr/local/bin/bluebuild:ro" \
            --workdir /workspace \
            fedora:44 \
            bash -euo pipefail -c '
              dnf install --assumeyes --quiet dconf flatpak git glib2 shellcheck systemd >/dev/null
              ./scripts/validate.sh
              ./scripts/validate-flatpaks.sh
            '

  silverblue:
    name: silverblue
    runs-on: ubuntu-latest
    needs: validate
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Build Silverblue
        uses: blue-build/github-action@v1
        with:
          recipe: silverblue.yml
          cosign_private_key: ${{ secrets.SIGNING_SECRET }}
          registry_token: ${{ github.token }}
          pr_event_number: ${{ github.event.number }}
          maximize_build_space: false
          squash: true
