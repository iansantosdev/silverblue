name: Build Custom Image

on:
  push:
    branches:
      - testing
    paths-ignore:
      - "**.md"
  pull_request:
    branches:
      - testing
  repository_dispatch:
    types:
      - build-image
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build validation image
        run: |
          podman build \
            --pull=always \
            --tag localhost/silverblue-validation:ci \
            --file .github/validation.Containerfile \
            .

      - name: Validate repository
        run: |
          podman run --rm \
            --userns=keep-id \
            --volume "$GITHUB_WORKSPACE:/workspace:ro" \
            --workdir /workspace \
            localhost/silverblue-validation:ci \
            ./scripts/validate.sh

      - name: Validate Flatpak references
        run: |
          podman run --rm \
            --userns=keep-id \
            --volume "$GITHUB_WORKSPACE:/workspace:ro" \
            --workdir /workspace \
            localhost/silverblue-validation:ci \
            ./scripts/validate-flatpaks.sh

  silverblue:
    name: silverblue
    runs-on: ubuntu-latest
    needs: validate
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Build Silverblue
        uses: blue-build/github-action@v1
        with:
          recipe: silverblue.yml
          cosign_private_key: ${{ secrets.SIGNING_SECRET }}
          registry_token: ${{ github.token }}
          pr_event_number: ${{ github.event.number }}
          maximize_build_space: false
          squash: true
